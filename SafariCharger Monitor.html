<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SafariCharger Monitor — Sandbox</title>
<link rel="stylesheet" href="design-system/colors_and_type.css">
<style>
  :root {
    --card-radius: 16px;
    --row-radius: 10px;
    --pill-radius: 999px;
    --pos: #1D9E75;
    --pos-bg: #E5F5EE;
    --neg: #B8493D;
    --neg-bg: #FBEAE7;
    --warn: #EF9F27;
    --warn-bg: #FDF1DC;
    --info-bg: #EAF1F8;
    --info: #2F6FB0;
  }
  html, body {
    margin: 0; padding: 0;
    background: var(--color-surface);
    color: var(--color-fg);
    font-family: var(--font-sans);
    font-size: 14px;
    min-height: 100vh;
  }
  *, *::before, *::after { box-sizing: border-box; }
  button { font-family: inherit; cursor: pointer; }
  input, select { font-family: inherit; }

  /* ── App shell ─────────────────────────────────────────── */
  .app {
    max-width: 1480px;
    margin: 0 auto;
    padding: 24px 32px 48px;
  }
  .topbar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 18px;
    background: #fff;
    border: 1px solid var(--color-border);
    border-radius: var(--card-radius);
    box-shadow: var(--shadow-xs);
  }
  .brand {
    display: flex; align-items: center; gap: 12px;
  }
  .brand-mark {
    width: 36px; height: 36px;
    background: var(--color-deep-forest);
    border-radius: 9px;
    display: grid; place-items: center;
    color: #fff;
  }
  .brand-mark svg { display: block; }
  .brand-name {
    font-size: 16px; font-weight: 800; letter-spacing: -0.01em;
    color: var(--color-charcoal); line-height: 1;
  }
  .brand-name .light { font-weight: 500; }
  .brand-sub {
    font-size: 9px; font-weight: 700; letter-spacing: 0.22em;
    color: var(--color-stone); text-transform: uppercase;
    margin-top: 4px;
  }
  .env-pill {
    margin-left: 6px;
    padding: 4px 10px;
    border-radius: var(--pill-radius);
    background: var(--warn-bg);
    color: var(--color-amber-dark);
    font-size: 10px; font-weight: 700;
    letter-spacing: 0.1em; text-transform: uppercase;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .env-pill::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%;
    background: var(--color-amber);
  }
  .topbar-spacer { flex: 1; }
  .topbar-meta {
    display: flex; align-items: center; gap: 14px;
  }
  .ws-pill {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 12px;
    border-radius: var(--pill-radius);
    background: var(--pos-bg);
    color: #0E6B4D;
    font-size: 12px; font-weight: 600;
  }
  .ws-pill .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--pos);
    box-shadow: 0 0 0 0 rgba(29,158,117, 0.6);
    animation: pulse 1.6s ease-out infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(29,158,117, 0.55); }
    70% { box-shadow: 0 0 0 8px rgba(29,158,117, 0); }
    100% { box-shadow: 0 0 0 0 rgba(29,158,117, 0); }
  }
  .user-chip {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 4px 8px 4px 4px;
    border-radius: var(--pill-radius);
    border: 1px solid var(--color-border);
    background: #fff;
  }
  .user-chip .avatar {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--color-deep-forest);
    color: #fff; font-weight: 700; font-size: 12px;
    display: grid; place-items: center;
  }
  .user-chip .who {
    font-size: 12px; font-weight: 600; color: var(--color-slate);
    padding-right: 4px;
  }
  .user-chip .who small {
    display: block; font-weight: 500; font-size: 10px; color: var(--color-stone);
  }
  .btn-logout {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px;
    border-radius: 10px;
    background: #fff;
    border: 1px solid var(--color-border);
    color: var(--color-slate);
    font-size: 12px; font-weight: 600;
    transition: 150ms;
  }
  .btn-logout:hover { background: #FBEAE7; color: #B8493D; border-color: #F0C9C2; }

  /* ── Page heading ─────────────────────────────────────── */
  .page-head {
    display: flex; align-items: flex-end; justify-content: space-between;
    margin: 28px 4px 18px;
  }
  .page-head h1 {
    margin: 0; font-size: 28px; font-weight: 800;
    letter-spacing: -0.015em;
    color: var(--color-charcoal);
  }
  .page-head h1 .accent { color: var(--color-deep-forest); }
  .page-head .sub {
    margin-top: 6px;
    font-size: 13px; color: var(--color-stone);
  }
  .session-meta {
    display: flex; gap: 18px; align-items: center;
    font-size: 12px; color: var(--color-stone);
  }
  .session-meta .k { font-weight: 700; color: var(--color-slate); margin-right: 4px; }

  /* ── Cards grid ───────────────────────────────────────── */
  .grid {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 18px;
  }
  .card {
    background: #fff;
    border-radius: var(--card-radius);
    border: 1px solid rgba(222,220,209,0.7);
    box-shadow: var(--shadow-sm);
    padding: 22px 22px 20px;
    display: flex; flex-direction: column;
    min-width: 0;
  }
  .card.col-4 { grid-column: span 4; }
  .card.col-6 { grid-column: span 6; }
  .card.col-8 { grid-column: span 8; }
  .card.col-12 { grid-column: span 12; }
  @media (max-width: 1180px) {
    .card.col-4 { grid-column: span 6; }
  }
  @media (max-width: 820px) {
    .card.col-4, .card.col-6, .card.col-8 { grid-column: span 12; }
  }

  .card-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
  }
  .card-head .left {
    display: flex; align-items: center; gap: 12px; min-width: 0;
  }
  .card-icon {
    width: 36px; height: 36px;
    border-radius: 10px;
    display: grid; place-items: center;
    flex: 0 0 auto;
  }
  .card-icon.green { background: #E5F2EC; color: var(--color-deep-forest); }
  .card-icon.amber { background: #FDF1DC; color: var(--color-amber-dark); }
  .card-icon.mint  { background: #E5F8F0; color: var(--color-emerald); }
  .card-title {
    font-size: 11px; font-weight: 700;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--color-stone);
    line-height: 1;
    margin-bottom: 4px;
  }
  .card-h {
    font-size: 18px; font-weight: 800;
    letter-spacing: -0.01em;
    color: var(--color-charcoal);
    line-height: 1.1;
  }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px;
    border-radius: var(--pill-radius);
    font-size: 10px; font-weight: 700;
    letter-spacing: 0.12em; text-transform: uppercase;
  }
  .badge.pos { background: var(--pos-bg); color: #0E6B4D; }
  .badge.warn { background: var(--warn-bg); color: var(--color-amber-dark); }
  .badge.info { background: var(--info-bg); color: var(--info); }
  .badge.neg { background: var(--neg-bg); color: var(--neg); }
  .badge.muted { background: #F1EEE6; color: var(--color-slate); }
  .badge .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: currentColor;
  }

  hr.brand-divider {
    height: 2px; border: 0;
    background: linear-gradient(90deg, var(--color-amber) 0%, var(--color-amber-dark) 100%);
    border-radius: 999px;
    margin: 0 0 16px 0;
    width: 36px;
  }

  /* ── Wallet ───────────────────────────────────────────── */
  .wallet-hero {
    background: linear-gradient(135deg, #0F6E56 0%, #0A4F3D 100%);
    color: #fff;
    border-radius: 14px;
    padding: 18px 20px;
    position: relative; overflow: hidden;
  }
  .wallet-hero::before {
    content: ""; position: absolute; right: -40px; top: -40px;
    width: 180px; height: 180px; border-radius: 50%;
    background: radial-gradient(circle, rgba(159,225,203,0.18), rgba(159,225,203,0));
  }
  .wallet-hero::after {
    content: ""; position: absolute; right: -10px; bottom: -60px;
    width: 130px; height: 130px; border-radius: 50%;
    background: radial-gradient(circle, rgba(239,159,39,0.18), rgba(239,159,39,0));
  }
  .wallet-label {
    font-size: 10px; font-weight: 700;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: rgba(255,255,255,0.7);
    margin-bottom: 8px;
  }
  .wallet-balance {
    display: flex; align-items: baseline; gap: 8px;
    font-feature-settings: "tnum";
  }
  .wallet-balance .num {
    font-size: 38px; font-weight: 800; letter-spacing: -0.02em;
    line-height: 1;
  }
  .wallet-balance .ccy {
    font-size: 14px; font-weight: 700;
    color: var(--color-mint);
    letter-spacing: 0.08em;
  }
  .wallet-meta {
    display: flex; gap: 22px;
    margin-top: 14px;
    font-size: 11px;
    color: rgba(255,255,255,0.85);
  }
  .wallet-meta .k {
    display: block; font-size: 9px; font-weight: 700;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: rgba(255,255,255,0.55);
    margin-bottom: 3px;
  }
  .wallet-meta .v { font-size: 12px; font-weight: 600; color: #fff; font-feature-settings: "tnum"; }
  .wallet-actions {
    display: flex; gap: 8px;
    margin-top: 16px;
  }
  .btn-primary {
    display: inline-flex; align-items: center; justify-content: center;
    gap: 8px;
    padding: 10px 16px;
    border: 0; border-radius: 10px;
    background: var(--color-amber);
    color: #fff;
    font-size: 13px; font-weight: 700;
    box-shadow: 0 4px 12px rgba(239,159,39,0.3);
    transition: 150ms;
  }
  .btn-primary:hover { background: var(--color-amber-dark); transform: translateY(-1px); }
  .btn-primary:active { transform: translateY(0) scale(0.98); }
  .btn-ghost-light {
    display: inline-flex; align-items: center; justify-content: center;
    gap: 8px;
    padding: 10px 14px;
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 10px;
    background: rgba(255,255,255,0.08);
    color: #fff;
    font-size: 13px; font-weight: 600;
    transition: 150ms;
  }
  .btn-ghost-light:hover { background: rgba(255,255,255,0.16); }

  .section-label {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 10px; font-weight: 700;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--color-stone);
    margin: 18px 0 10px;
  }
  .section-label a {
    color: var(--color-deep-forest);
    text-decoration: none; font-weight: 700;
  }

  .tx-list { display: flex; flex-direction: column; gap: 0; }
  .tx-row {
    display: grid;
    grid-template-columns: 32px 1fr auto;
    align-items: center;
    gap: 12px;
    padding: 10px 6px;
    border-bottom: 1px dashed rgba(222,220,209,0.7);
  }
  .tx-row:last-child { border-bottom: 0; }
  .tx-icon {
    width: 32px; height: 32px; border-radius: 8px;
    display: grid; place-items: center;
  }
  .tx-icon.debit { background: var(--warn-bg); color: var(--color-amber-dark); }
  .tx-icon.credit { background: var(--pos-bg); color: #0E6B4D; }
  .tx-meta { min-width: 0; }
  .tx-title {
    font-size: 13px; font-weight: 700; color: var(--color-charcoal);
    line-height: 1.2;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .tx-sub {
    font-size: 11px; color: var(--color-stone); margin-top: 2px;
    font-feature-settings: "tnum";
  }
  .tx-amt {
    font-size: 14px; font-weight: 700;
    font-feature-settings: "tnum";
  }
  .tx-amt.debit { color: var(--neg); }
  .tx-amt.credit { color: #0E6B4D; }

  /* ── Reservation form ──────────────────────────────────── */
  .field {
    display: flex; flex-direction: column; gap: 6px;
    min-width: 0;
  }
  .field label {
    font-size: 10px; font-weight: 700;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--color-stone);
  }
  .field input, .field select {
    border: 1px solid var(--color-border);
    border-radius: 10px;
    padding: 10px 12px;
    background: #fff;
    color: var(--color-charcoal);
    font-size: 13px; font-weight: 500;
    transition: 150ms;
    width: 100%;
    font-feature-settings: "tnum";
  }
  .field input:focus, .field select:focus {
    outline: none;
    border-color: var(--color-deep-forest);
    box-shadow: 0 0 0 3px rgba(15,110,86,0.12);
  }
  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .form-actions {
    display: flex; gap: 8px; margin-top: 14px;
  }
  .btn-solid {
    flex: 1;
    display: inline-flex; align-items: center; justify-content: center;
    gap: 8px;
    padding: 11px 16px;
    border: 0; border-radius: 10px;
    background: var(--color-deep-forest);
    color: #fff;
    font-size: 13px; font-weight: 700;
    transition: 150ms;
    box-shadow: 0 1px 0 rgba(0,0,0,0.04);
  }
  .btn-solid:hover { background: var(--color-deep-forest-dark); }
  .btn-solid:active { transform: scale(0.98); }
  .btn-solid:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Active reservations */
  .reservation-card {
    border: 1px solid rgba(222,220,209,0.9);
    border-radius: 12px;
    padding: 14px;
    margin-top: 12px;
    background: linear-gradient(180deg, #fff 0%, #FAFBF8 100%);
  }
  .reservation-card.empty {
    border: 1.5px dashed var(--color-border);
    background: transparent;
    padding: 28px 16px;
    text-align: center;
  }
  .reservation-card.empty .e-icon {
    width: 44px; height: 44px; margin: 0 auto 10px;
    border-radius: 12px;
    background: var(--color-surface);
    display: grid; place-items: center;
    color: var(--color-stone);
  }
  .reservation-card.empty .e-t { font-size: 13px; font-weight: 700; color: var(--color-slate); }
  .reservation-card.empty .e-s { font-size: 11px; color: var(--color-stone); margin-top: 3px; }

  .res-top {
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 10px; margin-bottom: 10px;
  }
  .res-id {
    font-size: 13px; font-weight: 800; color: var(--color-charcoal);
    letter-spacing: -0.005em;
  }
  .res-id small {
    display: block; font-size: 10px; font-weight: 700;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--color-stone); margin-bottom: 2px;
  }
  .res-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 10px;
  }
  .res-cell .k {
    font-size: 9px; font-weight: 700;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--color-stone);
  }
  .res-cell .v {
    font-size: 13px; font-weight: 700; color: var(--color-charcoal);
    margin-top: 2px;
    font-feature-settings: "tnum";
  }
  .res-actions { display: flex; gap: 8px; }
  .btn-sm {
    display: inline-flex; align-items: center; justify-content: center;
    gap: 6px;
    padding: 8px 12px;
    border: 0; border-radius: 8px;
    font-size: 12px; font-weight: 700;
    transition: 150ms;
  }
  .btn-sm.start {
    background: var(--color-deep-forest);
    color: #fff;
    flex: 1.4;
  }
  .btn-sm.start:hover { background: var(--color-deep-forest-dark); }
  .btn-sm.cancel {
    background: #fff;
    color: var(--neg);
    border: 1px solid #F0C9C2;
    flex: 1;
  }
  .btn-sm.cancel:hover { background: #FBEAE7; }
  .btn-sm:disabled { opacity: 0.4; cursor: not-allowed; }

  .countdown {
    margin-top: 10px;
    height: 4px; border-radius: 999px;
    background: var(--color-surface);
    overflow: hidden;
  }
  .countdown > span {
    display: block; height: 100%;
    background: linear-gradient(90deg, var(--color-emerald), var(--color-deep-forest));
    transition: width 1s linear;
  }
  .countdown-label {
    display: flex; justify-content: space-between;
    font-size: 10px; color: var(--color-stone); margin-top: 6px;
    font-feature-settings: "tnum";
  }

  /* ── Charging gauge ───────────────────────────────────── */
  .gauge-wrap {
    display: flex; flex-direction: column; align-items: center;
    padding: 6px 0 10px;
  }
  .gauge {
    position: relative; width: 220px; height: 220px;
  }
  .gauge svg { transform: rotate(-90deg); width: 100%; height: 100%; }
  .gauge .center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
  }
  .gauge .pct {
    font-size: 44px; font-weight: 800; letter-spacing: -0.02em;
    color: var(--color-charcoal);
    line-height: 1;
    font-feature-settings: "tnum";
  }
  .gauge .pct .unit {
    font-size: 18px; color: var(--color-stone); font-weight: 600;
    margin-left: 4px;
  }
  .gauge .lab {
    margin-top: 6px;
    font-size: 9px; font-weight: 700;
    letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--color-stone);
  }
  .gauge .live-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--color-amber);
    display: inline-block; margin-right: 6px;
    animation: pulse-amber 1.4s ease-out infinite;
  }
  @keyframes pulse-amber {
    0% { box-shadow: 0 0 0 0 rgba(239,159,39,0.5); }
    70% { box-shadow: 0 0 0 7px rgba(239,159,39,0); }
    100% { box-shadow: 0 0 0 0 rgba(239,159,39,0); }
  }

  .charge-stats {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin: 14px 0 12px;
    padding: 12px;
    background: var(--color-surface);
    border-radius: 12px;
  }
  .charge-stat {
    text-align: center;
    border-right: 1px dashed var(--color-border);
  }
  .charge-stat:last-child { border-right: 0; }
  .charge-stat .k {
    font-size: 9px; font-weight: 700;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--color-stone);
  }
  .charge-stat .v {
    font-size: 16px; font-weight: 800; color: var(--color-charcoal);
    margin-top: 4px;
    font-feature-settings: "tnum";
  }
  .charge-stat .v small {
    font-size: 10px; font-weight: 600; color: var(--color-stone);
    margin-left: 2px;
  }

  .btn-stop {
    width: 100%;
    display: inline-flex; align-items: center; justify-content: center;
    gap: 8px;
    padding: 12px 16px;
    border: 0; border-radius: 10px;
    background: #B8493D;
    color: #fff;
    font-size: 13px; font-weight: 800;
    letter-spacing: 0.02em;
    transition: 150ms;
    box-shadow: 0 4px 12px rgba(184,73,61,0.25);
  }
  .btn-stop:hover { background: #9A3A30; }
  .btn-stop:active { transform: scale(0.98); }

  .charge-empty {
    text-align: center; padding: 24px 8px;
  }
  .charge-empty .icon {
    width: 64px; height: 64px; margin: 0 auto 12px;
    border-radius: 18px;
    background: var(--color-surface);
    display: grid; place-items: center;
    color: var(--color-stone);
  }
  .charge-empty h3 {
    margin: 0; font-size: 16px; font-weight: 800; color: var(--color-charcoal);
  }
  .charge-empty p {
    margin: 4px 0 0; font-size: 12px; color: var(--color-stone);
  }

  .session-row {
    display: grid;
    grid-template-columns: 32px 1fr auto auto;
    align-items: center;
    gap: 12px;
    padding: 10px 6px;
    border-bottom: 1px dashed rgba(222,220,209,0.7);
  }
  .session-row:last-child { border-bottom: 0; }
  .session-row .si {
    width: 32px; height: 32px; border-radius: 8px;
    background: #E5F2EC; color: var(--color-deep-forest);
    display: grid; place-items: center;
  }
  .session-row .meta {
    min-width: 0;
  }
  .session-row .meta .t {
    font-size: 13px; font-weight: 700; color: var(--color-charcoal);
    line-height: 1.2;
  }
  .session-row .meta .s {
    font-size: 11px; color: var(--color-stone); margin-top: 2px;
    font-feature-settings: "tnum";
  }
  .session-row .kw {
    font-size: 13px; font-weight: 800; color: var(--color-charcoal);
    font-feature-settings: "tnum";
  }
  .session-row .kw small {
    display: block; font-size: 9px; font-weight: 700;
    color: var(--color-stone); letter-spacing: 0.16em; text-transform: uppercase;
    text-align: right; margin-top: 2px;
  }

  /* ── Status strip ─────────────────────────────────────── */
  .status-strip {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    margin-top: 18px;
  }
  .status-tile {
    background: #fff;
    border: 1px solid var(--color-border);
    border-radius: 12px;
    padding: 12px 14px;
    display: flex; align-items: center; gap: 10px;
  }
  .status-tile .si {
    width: 32px; height: 32px; border-radius: 9px;
    display: grid; place-items: center; flex: 0 0 auto;
  }
  .status-tile .info { min-width: 0; }
  .status-tile .info .k {
    font-size: 9px; font-weight: 700; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--color-stone);
  }
  .status-tile .info .v {
    font-size: 13px; font-weight: 700; color: var(--color-charcoal);
    margin-top: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .status-tile.ok .si { background: var(--pos-bg); color: #0E6B4D; }
  .status-tile.ok .info .v { color: #0E6B4D; }
  .status-tile.warn .si { background: var(--warn-bg); color: var(--color-amber-dark); }
  .status-tile.info .si { background: var(--info-bg); color: var(--info); }

  @media (max-width: 1180px) { .status-strip { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 720px) { .status-strip { grid-template-columns: 1fr 1fr; } }

  /* ── Debug log ────────────────────────────────────────── */
  .debug {
    margin-top: 18px;
    background: #fff;
    border: 1px solid var(--color-border);
    border-radius: var(--card-radius);
    overflow: hidden;
  }
  .debug-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px;
    cursor: pointer;
    user-select: none;
  }
  .debug-head .left {
    display: flex; align-items: center; gap: 12px;
  }
  .debug-head .icon {
    width: 28px; height: 28px; border-radius: 8px;
    background: var(--color-charcoal); color: #9FE1CB;
    display: grid; place-items: center;
  }
  .debug-head h4 {
    margin: 0; font-size: 13px; font-weight: 800; color: var(--color-charcoal);
  }
  .debug-head .count {
    font-size: 10px; font-weight: 700;
    color: var(--color-stone);
    letter-spacing: 0.12em; text-transform: uppercase;
    margin-top: 2px;
  }
  .debug-head .chevron {
    width: 28px; height: 28px; border-radius: 8px;
    background: var(--color-surface);
    display: grid; place-items: center;
    color: var(--color-slate);
    transition: 200ms;
  }
  .debug.open .chevron { transform: rotate(180deg); }
  .debug-body {
    background: #15171A;
    color: #C7E5DA;
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 16px 18px;
    max-height: 0;
    overflow: hidden;
    transition: max-height 250ms ease, padding 200ms ease;
  }
  .debug.open .debug-body {
    max-height: 280px;
    overflow: auto;
  }
  .debug-line {
    display: flex; gap: 10px; padding: 2px 0;
    line-height: 1.6;
  }
  .debug-line .ts { color: #6B7C76; flex: 0 0 auto; }
  .debug-line .lvl { width: 56px; flex: 0 0 auto; font-weight: 700; }
  .debug-line.debug-l .lvl { color: #88B8A6; }
  .debug-line.info-l .lvl { color: #7FB7E0; }
  .debug-line.ok-l .lvl { color: #5DCAA3; }
  .debug-line.warn-l .lvl { color: #EFB75A; }

  .root { min-height: 100vh; }
</style>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

// ── Icons ──────────────────────────────────────────────────
const Icon = ({ d, size = 18, stroke = 2 }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={stroke} strokeLinecap="round" strokeLinejoin="round">{d}</svg>
);
const I = {
  Wallet:   <Icon d={<><path d="M19 7H5a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2Z"/><path d="M16 14h2"/><path d="M3 9V7a2 2 0 0 1 2-2h11"/></>}/>,
  Plus:     <Icon d={<><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></>}/>,
  Receipt:  <Icon d={<><path d="M4 2v20l3-2 3 2 3-2 3 2 3-2 3 2V2"/><path d="M8 7h8"/><path d="M8 12h8"/><path d="M8 17h5"/></>}/>,
  Calendar: <Icon d={<><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></>}/>,
  Bolt:     <Icon d={<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>}/>,
  Stop:     <Icon d={<rect x="6" y="6" width="12" height="12" rx="2"/>}/>,
  Play:     <Icon d={<polygon points="6 4 20 12 6 20 6 4"/>}/>,
  X:        <Icon d={<><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></>}/>,
  Logout:   <Icon d={<><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></>}/>,
  Chevron:  <Icon d={<polyline points="6 9 12 15 18 9"/>}/>,
  Terminal: <Icon d={<><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></>}/>,
  Car:      <Icon d={<><path d="M14 16H9m10 0h3v-3.15a1 1 0 0 0-.84-.99L16 11l-2.7-3.6a1 1 0 0 0-.8-.4H5.24a2 2 0 0 0-1.8 1.1l-.8 1.63A6 6 0 0 0 2 12.42V16h2"/><circle cx="6.5" cy="16.5" r="2.5"/><circle cx="16.5" cy="16.5" r="2.5"/></>}/>,
  Battery:  <Icon d={<><rect x="2" y="7" width="16" height="10" rx="2"/><line x1="22" y1="11" x2="22" y2="13"/><rect x="5" y="10" width="7" height="4" fill="currentColor" stroke="none"/></>}/>,
  Connect:  <Icon d={<><path d="M9 17H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h4"/><path d="M15 7h4a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-4"/><line x1="9" y1="12" x2="15" y2="12"/></>}/>,
  Pulse:    <Icon d={<polyline points="3 12 7 12 10 5 14 19 17 12 21 12"/>}/>,
  Lock:     <Icon d={<><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></>}/>,
  Wifi:     <Icon d={<><path d="M5 12.55a11 11 0 0 1 14 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></>}/>,
  Hash:     <Icon d={<><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/></>}/>,
  Inbox:    <Icon d={<><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11Z"/></>}/>,
};

// ── Helpers ────────────────────────────────────────────────
const fmt = (n, d=2) => n.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const fmtTime = (sec) => {
  const m = Math.floor(sec/60).toString().padStart(2,'0');
  const s = Math.floor(sec%60).toString().padStart(2,'0');
  return `${m}:${s}`;
};
const ago = (ms) => {
  const s = Math.floor((Date.now() - ms)/1000);
  if (s < 60) return `${s}s ago`;
  const m = Math.floor(s/60);
  if (m < 60) return `${m}m ago`;
  const h = Math.floor(m/60);
  if (h < 24) return `${h}h ago`;
  return `${Math.floor(h/24)}d ago`;
};

// ── App ────────────────────────────────────────────────────
function App() {
  const [balance, setBalance] = useState(6915.39);
  const [transactions, setTransactions] = useState([
    { id: 't1', amount: 10.00, type: 'debit', status: 'completed', label: 'Charging session · CB-NYR-04', time: Date.now() - 1000*60*8 },
    { id: 't2', amount: 8.00,  type: 'debit', status: 'completed', label: 'Charging session · CB-KGL-12', time: Date.now() - 1000*60*42 },
    { id: 't3', amount: 500.00, type: 'credit', status: 'completed', label: 'Wallet top-up · MoMo', time: Date.now() - 1000*60*60*2 },
    { id: 't4', amount: 500.00, type: 'debit', status: 'completed', label: 'Reservation hold · CB-KGL-09', time: Date.now() - 1000*60*60*5 },
    { id: 't5', amount: 500.00, type: 'credit', status: 'completed', label: 'Wallet top-up · Card', time: Date.now() - 1000*60*60*9 },
  ]);

  const [form, setForm] = useState({ chargeBox: 'CB-KGL-12', connector: '2', plate: 'RAH 482 K', battery: '38' });
  const [reservations, setReservations] = useState([
    {
      id: 'RES-7724', chargeBox: 'CB-KGL-12', connector: 2,
      plate: 'RAH 482 K', battery: 38,
      expires: Date.now() + 1000*60*7, total: 1000*60*15
    }
  ]);

  const [session, setSession] = useState({
    active: true,
    chargeBox: 'CB-NYR-04', connector: 1,
    plate: 'RAB 117 D',
    startSoc: 22, currentSoc: 64, targetSoc: 90,
    powerKw: 47.2, energyKwh: 12.84, costRwf: 1284,
    startedAt: Date.now() - 1000*60*16,
  });

  const [recentSessions] = useState([
    { id: 's1', chargeBox: 'CB-KGL-12', kwh: 18.42, rwf: 1842, mins: 26, when: Date.now() - 1000*60*60*3 },
    { id: 's2', chargeBox: 'CB-NYR-02', kwh: 9.10, rwf: 910, mins: 14, when: Date.now() - 1000*60*60*22 },
    { id: 's3', chargeBox: 'CB-MUS-01', kwh: 31.7, rwf: 3170, mins: 48, when: Date.now() - 1000*60*60*48 },
  ]);

  const [now, setNow] = useState(Date.now());
  const [debugOpen, setDebugOpen] = useState(false);

  // ticker
  useEffect(() => {
    const t = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(t);
  }, []);

  // simulate live charging
  useEffect(() => {
    if (!session.active) return;
    const t = setInterval(() => {
      setSession(s => {
        if (!s.active) return s;
        const next = Math.min(s.targetSoc, s.currentSoc + 0.12);
        const newE = +(s.energyKwh + s.powerKw / 3600).toFixed(2);
        const fluct = s.powerKw + (Math.random() - 0.5) * 0.6;
        return {
          ...s,
          currentSoc: +next.toFixed(1),
          energyKwh: newE,
          costRwf: Math.round(newE * 100),
          powerKw: +Math.max(40, Math.min(50, fluct)).toFixed(1),
        };
      });
    }, 1000);
    return () => clearInterval(t);
  }, [session.active]);

  // Reservation handlers
  const onCreateReservation = (e) => {
    e.preventDefault();
    if (!form.chargeBox || !form.connector) return;
    const newRes = {
      id: 'RES-' + Math.floor(Math.random()*9000+1000),
      chargeBox: form.chargeBox, connector: +form.connector,
      plate: form.plate, battery: +form.battery,
      expires: Date.now() + 1000*60*15, total: 1000*60*15
    };
    setReservations(r => [newRes, ...r]);
  };
  const onCancelReservation = (id) => setReservations(r => r.filter(x => x.id !== id));
  const onStartCharging = (res) => {
    setReservations(r => r.filter(x => x.id !== res.id));
    setSession({
      active: true,
      chargeBox: res.chargeBox, connector: res.connector,
      plate: res.plate,
      startSoc: res.battery, currentSoc: res.battery, targetSoc: 90,
      powerKw: 45.0, energyKwh: 0, costRwf: 0,
      startedAt: Date.now(),
    });
  };
  const onStopCharging = () => {
    setSession(s => ({ ...s, active: false }));
    setBalance(b => +(b - session.costRwf).toFixed(2));
    setTransactions(t => [
      { id: 'tx-'+Date.now(), amount: session.costRwf, type: 'debit', status: 'completed',
        label: `Charging session · ${session.chargeBox}`, time: Date.now() },
      ...t
    ]);
  };
  const onTopup = () => {
    const amt = 500;
    setBalance(b => +(b + amt).toFixed(2));
    setTransactions(t => [
      { id: 'tx-'+Date.now(), amount: amt, type: 'credit', status: 'completed',
        label: 'Wallet top-up · MoMo', time: Date.now() },
      ...t
    ]);
  };

  const sessionDuration = session.active ? Math.floor((now - session.startedAt)/1000) : 0;
  const socFraction = (session.currentSoc - session.startSoc) / Math.max(1,(session.targetSoc - session.startSoc));

  return (
    <div className="app">
      <Topbar />
      <div className="page-head">
        <div>
          <h1>Sandbox <span className="accent">Monitor</span></h1>
          <div className="sub">Real-time wallet, reservation and charging telemetry — sandbox environment</div>
        </div>
        <div className="session-meta">
          <div><span className="k">Region</span> RW · East</div>
          <div><span className="k">API</span> v3.4.2</div>
          <div><span className="k">Latency</span> 84ms</div>
        </div>
      </div>

      <div className="grid">
        <WalletCard balance={balance} transactions={transactions} onTopup={onTopup} />
        <ReservationCard
          form={form} setForm={setForm}
          reservations={reservations}
          onCreate={onCreateReservation}
          onCancel={onCancelReservation}
          onStart={onStartCharging}
          now={now}
          chargingActive={session.active}
        />
        <ChargingCard
          session={session}
          recentSessions={recentSessions}
          onStop={onStopCharging}
          duration={sessionDuration}
          socFraction={socFraction}
        />
      </div>

      <StatusStrip session={session} reservations={reservations} balance={balance} />

      <Debug open={debugOpen} setOpen={setDebugOpen} />
    </div>
  );
}

// ── Topbar ─────────────────────────────────────────────────
function Topbar() {
  return (
    <div className="topbar">
      <div className="brand">
        <div className="brand-mark">
          <svg width="20" height="20" viewBox="0 0 32 32" fill="none">
            <path d="M16 3 L28 10 L28 22 L16 29 L4 22 L4 10 Z" stroke="white" strokeWidth="2" fill="none"/>
            <path d="M11 20 L16 9 L21 20 M13 16 L19 16" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        </div>
        <div>
          <div className="brand-name"><strong>Safari</strong><span className="light">Charger</span></div>
          <div className="brand-sub">Sandbox Monitor</div>
        </div>
        <span className="env-pill">Sandbox</span>
      </div>
      <div className="topbar-spacer"></div>
      <div className="topbar-meta">
        <span className="ws-pill"><span className="dot"></span>STOMP connected · /user/queue</span>
        <span className="user-chip">
          <span className="avatar">CC</span>
          <span className="who">Customer 001<small>caring.crux+customer001@gmail.com</small></span>
        </span>
        <button className="btn-logout">{I.Logout} Logout</button>
      </div>
    </div>
  );
}

// ── Wallet ─────────────────────────────────────────────────
function WalletCard({ balance, transactions, onTopup }) {
  return (
    <div className="card col-4">
      <div className="card-head">
        <div className="left">
          <div className="card-icon green">{I.Wallet}</div>
          <div>
            <div className="card-title">Wallet</div>
            <div className="card-h">Balance & activity</div>
          </div>
        </div>
        <span className="badge pos"><span className="dot"></span>Active</span>
      </div>
      <hr className="brand-divider" />

      <div className="wallet-hero">
        <div className="wallet-label">Available balance</div>
        <div className="wallet-balance">
          <span className="num">{fmt(balance)}</span>
          <span className="ccy">RWF</span>
        </div>
        <div className="wallet-meta">
          <div>
            <span className="k">Account</span>
            <span className="v">488FEB73260F</span>
          </div>
          <div>
            <span className="k">Tier</span>
            <span className="v">Standard</span>
          </div>
        </div>
        <div className="wallet-actions">
          <button className="btn-primary" onClick={onTopup}>{I.Plus} Top up wallet</button>
          <button className="btn-ghost-light">{I.Receipt} Statement</button>
        </div>
      </div>

      <div className="section-label">
        <span>Recent transactions</span>
        <a href="#">View all →</a>
      </div>

      <div className="tx-list">
        {transactions.slice(0,5).map(t => (
          <div className="tx-row" key={t.id}>
            <div className={"tx-icon " + t.type}>
              {t.type === 'debit' ? I.Bolt : I.Plus}
            </div>
            <div className="tx-meta">
              <div className="tx-title">{t.label}</div>
              <div className="tx-sub">{ago(t.time)} · {t.status.toUpperCase()}</div>
            </div>
            <div className={"tx-amt " + t.type}>
              {t.type === 'debit' ? '−' : '+'}{fmt(t.amount)}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── Reservation ────────────────────────────────────────────
function ReservationCard({ form, setForm, reservations, onCreate, onCancel, onStart, now, chargingActive }) {
  const upd = (k) => (e) => setForm(f => ({...f, [k]: e.target.value}));

  return (
    <div className="card col-4">
      <div className="card-head">
        <div className="left">
          <div className="card-icon amber">{I.Calendar}</div>
          <div>
            <div className="card-title">Reservation</div>
            <div className="card-h">Hold a connector</div>
          </div>
        </div>
        <span className="badge muted">{reservations.length} active</span>
      </div>
      <hr className="brand-divider" />

      <form onSubmit={onCreate}>
        <div className="form-grid">
          <div className="field">
            <label>Charge Box ID</label>
            <input value={form.chargeBox} onChange={upd('chargeBox')} placeholder="e.g. CB-KGL-12" />
          </div>
          <div className="field">
            <label>Connector</label>
            <select value={form.connector} onChange={upd('connector')}>
              <option value="1">1 · CCS2</option>
              <option value="2">2 · Type 2</option>
              <option value="3">3 · CHAdeMO</option>
            </select>
          </div>
          <div className="field">
            <label>Plate Number</label>
            <input value={form.plate} onChange={upd('plate')} placeholder="RAH 482 K" />
          </div>
          <div className="field">
            <label>Battery %</label>
            <input value={form.battery} onChange={upd('battery')} placeholder="0–100" type="number" />
          </div>
        </div>
        <div className="form-actions">
          <button type="submit" className="btn-solid">{I.Plus} Create reservation</button>
        </div>
      </form>

      <div className="section-label">
        <span>Active reservations</span>
        <span style={{color: 'var(--color-stone)'}}>auto-expire · 15 min</span>
      </div>

      {reservations.length === 0 ? (
        <div className="reservation-card empty">
          <div className="e-icon">{I.Inbox}</div>
          <div className="e-t">No active reservations</div>
          <div className="e-s">Submit the form above to hold a connector for 15 minutes.</div>
        </div>
      ) : reservations.map(r => {
        const remaining = Math.max(0, r.expires - now);
        const pct = Math.max(0, Math.min(100, (remaining / r.total) * 100));
        const remSec = Math.floor(remaining/1000);
        return (
          <div className="reservation-card" key={r.id}>
            <div className="res-top">
              <div className="res-id">
                <small>Reservation</small>
                {r.id}
              </div>
              <span className="badge info"><span className="dot"></span>Held</span>
            </div>
            <div className="res-grid">
              <div className="res-cell"><div className="k">Charge Box</div><div className="v">{r.chargeBox}</div></div>
              <div className="res-cell"><div className="k">Conn.</div><div className="v">#{r.connector}</div></div>
              <div className="res-cell"><div className="k">Battery</div><div className="v">{r.battery}%</div></div>
              <div className="res-cell"><div className="k">Plate</div><div className="v">{r.plate || '—'}</div></div>
              <div className="res-cell"><div className="k">Expires</div><div className="v">{fmtTime(remSec)}</div></div>
              <div className="res-cell"><div className="k">Status</div><div className="v" style={{color:'var(--color-emerald)'}}>● Ready</div></div>
            </div>
            <div className="countdown"><span style={{width: pct + '%'}}></span></div>
            <div className="countdown-label">
              <span>Time remaining</span>
              <span>{fmtTime(remSec)} / 15:00</span>
            </div>
            <div className="res-actions" style={{marginTop: 12}}>
              <button className="btn-sm start" disabled={chargingActive} onClick={() => onStart(r)}>
                {I.Play} Start charging session
              </button>
              <button className="btn-sm cancel" onClick={() => onCancel(r.id)}>
                {I.X} Cancel
              </button>
            </div>
            {chargingActive && (
              <div style={{
                marginTop: 8, fontSize: 10, color: 'var(--color-stone)',
                fontWeight: 600, letterSpacing: '0.04em', textAlign: 'center'
              }}>
                Stop the active session to start a new one.
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// ── Charging ───────────────────────────────────────────────
function ChargingCard({ session, recentSessions, onStop, duration, socFraction }) {
  const r = 88;
  const c = 2 * Math.PI * r;
  const dash = c * Math.max(0, Math.min(1, socFraction));
  return (
    <div className="card col-4">
      <div className="card-head">
        <div className="left">
          <div className="card-icon mint">{I.Bolt}</div>
          <div>
            <div className="card-title">Charging</div>
            <div className="card-h">Live session</div>
          </div>
        </div>
        {session.active
          ? <span className="badge pos"><span className="dot"></span>Charging</span>
          : <span className="badge muted"><span className="dot"></span>Idle</span>}
      </div>
      <hr className="brand-divider" />

      {session.active ? (
        <>
          <div className="gauge-wrap">
            <div className="gauge">
              <svg viewBox="0 0 200 200">
                <circle cx="100" cy="100" r={r} stroke="#F1EEE6" strokeWidth="14" fill="none" />
                <circle cx="100" cy="100" r={r}
                  stroke="url(#g1)" strokeWidth="14" fill="none"
                  strokeLinecap="round"
                  strokeDasharray={`${dash} ${c}`}
                  style={{ transition: 'stroke-dasharray 1s linear' }}
                />
                <defs>
                  <linearGradient id="g1" x1="0" x2="1" y1="0" y2="1">
                    <stop offset="0%" stopColor="#1D9E75"/>
                    <stop offset="100%" stopColor="#0F6E56"/>
                  </linearGradient>
                </defs>
              </svg>
              <div className="center">
                <div className="pct">{Math.round(session.currentSoc)}<span className="unit">%</span></div>
                <div className="lab"><span className="live-dot"></span>State of charge</div>
              </div>
            </div>
            <div style={{
              display:'flex', alignItems:'center', gap: 18, marginTop: 14,
              fontSize: 11, color: 'var(--color-stone)', fontWeight: 600
            }}>
              <div><strong style={{color: 'var(--color-charcoal)', fontSize: 13}}>{session.chargeBox}</strong> · Conn #{session.connector}</div>
              <div>Plate <strong style={{color: 'var(--color-charcoal)', fontSize: 13}}>{session.plate}</strong></div>
            </div>
          </div>

          <div className="charge-stats">
            <div className="charge-stat">
              <div className="k">Power</div>
              <div className="v">{fmt(session.powerKw, 1)}<small>kW</small></div>
            </div>
            <div className="charge-stat">
              <div className="k">Energy</div>
              <div className="v">{fmt(session.energyKwh, 2)}<small>kWh</small></div>
            </div>
            <div className="charge-stat">
              <div className="k">Cost</div>
              <div className="v">{Math.round(session.costRwf).toLocaleString()}<small>RWF</small></div>
            </div>
          </div>

          <div style={{
            display:'flex', justifyContent:'space-between', fontSize:11,
            color:'var(--color-stone)', fontWeight:600, marginBottom:10
          }}>
            <span>Started {fmtTime(duration)} ago · target {session.targetSoc}%</span>
            <span style={{color:'var(--color-deep-forest)'}}>~{Math.max(0, Math.round((session.targetSoc - session.currentSoc) / 0.12 / 60))} min remaining</span>
          </div>

          <button className="btn-stop" onClick={onStop}>{I.Stop} Stop charging session</button>
        </>
      ) : (
        <div className="charge-empty">
          <div className="icon">{I.Bolt}</div>
          <h3>No active charging</h3>
          <p>Start a session from a held reservation to see live telemetry.</p>
        </div>
      )}

      <div className="section-label">
        <span>Recent sessions</span>
        <a href="#">History →</a>
      </div>

      {recentSessions.map(s => (
        <div className="session-row" key={s.id}>
          <div className="si">{I.Bolt}</div>
          <div className="meta">
            <div className="t">{s.chargeBox}</div>
            <div className="s">{ago(s.when)} · {s.mins} min</div>
          </div>
          <div className="kw">
            {fmt(s.kwh, 2)}
            <small>kWh</small>
          </div>
          <div className="kw" style={{color:'var(--color-amber-dark)'}}>
            {s.rwf.toLocaleString()}
            <small>RWF</small>
          </div>
        </div>
      ))}
    </div>
  );
}

// ── Status strip ───────────────────────────────────────────
function StatusStrip({ session, reservations, balance }) {
  return (
    <div className="status-strip">
      <div className="status-tile ok">
        <div className="si">{I.Wallet}</div>
        <div className="info">
          <div className="k">Wallet</div>
          <div className="v">{fmt(balance)} RWF</div>
        </div>
      </div>
      <div className="status-tile info">
        <div className="si">{I.Pulse}</div>
        <div className="info">
          <div className="k">Wallet TX</div>
          <div className="v">Streaming · 5/m</div>
        </div>
      </div>
      <div className="status-tile warn">
        <div className="si">{I.Calendar}</div>
        <div className="info">
          <div className="k">Reservations</div>
          <div className="v">{reservations.length} held</div>
        </div>
      </div>
      <div className="status-tile ok">
        <div className="si">{I.Connect}</div>
        <div className="info">
          <div className="k">Charger</div>
          <div className="v">{session.active ? 'Charging' : 'Available'}</div>
        </div>
      </div>
      <div className="status-tile info">
        <div className="si">{I.Bolt}</div>
        <div className="info">
          <div className="k">Session</div>
          <div className="v">{session.active ? `${fmt(session.energyKwh,2)} kWh` : 'Idle'}</div>
        </div>
      </div>
    </div>
  );
}

// ── Debug log ──────────────────────────────────────────────
function Debug({ open, setOpen }) {
  const [lines, setLines] = useState([
    { ts: '12:04:08.331', lvl: 'DEBUG', txt: '>>> PING' },
    { ts: '12:04:08.342', lvl: 'DEBUG', txt: '<<< PONG' },
    { ts: '12:04:13.020', lvl: 'INFO',  txt: 'Subscribed /user/queue/wallet' },
    { ts: '12:04:13.022', lvl: 'INFO',  txt: 'Subscribed /user/queue/reservation' },
    { ts: '12:04:14.118', lvl: 'OK',    txt: 'MESSAGE wallet.balance.updated → 6,915.39 RWF' },
    { ts: '12:04:18.331', lvl: 'DEBUG', txt: '>>> PING' },
    { ts: '12:04:18.341', lvl: 'DEBUG', txt: '<<< PONG' },
    { ts: '12:04:24.512', lvl: 'OK',    txt: 'MESSAGE charging.session.kw → 47.2 kW' },
    { ts: '12:04:28.330', lvl: 'DEBUG', txt: '>>> PING' },
    { ts: '12:04:28.339', lvl: 'DEBUG', txt: '<<< PONG' },
    { ts: '12:04:34.611', lvl: 'WARN',  txt: 'Reservation RES-7724 expires in 7m' },
    { ts: '12:04:38.330', lvl: 'DEBUG', txt: '>>> PING' },
    { ts: '12:04:38.339', lvl: 'DEBUG', txt: '<<< PONG' },
  ]);

  const lvlClass = (l) => l === 'INFO' ? 'info-l' : l === 'OK' ? 'ok-l' : l === 'WARN' ? 'warn-l' : 'debug-l';
  return (
    <div className={"debug " + (open ? 'open' : '')}>
      <div className="debug-head" onClick={() => setOpen(o => !o)}>
        <div className="left">
          <div className="icon">{I.Terminal}</div>
          <div>
            <h4>STOMP message log</h4>
            <div className="count">{lines.length} events · click to {open ? 'collapse' : 'expand'}</div>
          </div>
        </div>
        <div className="chevron">{I.Chevron}</div>
      </div>
      <div className="debug-body">
        {lines.map((l, i) => (
          <div className={"debug-line " + lvlClass(l.lvl)} key={i}>
            <span className="ts">{l.ts}</span>
            <span className="lvl">[{l.lvl}]</span>
            <span>{l.txt}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
