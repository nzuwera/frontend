# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name phpmyadmin.safaricharger.com api.safaricharger.com auth.safaricharger.com;
    return 301 https://$host$request_uri;
}

# ── API Gateway ───────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name api.safaricharger.com;

    ssl_certificate     /etc/nginx/certs/safaricharge.bundle.pem;
    ssl_certificate_key /etc/nginx/certs/safaricharge.key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 20M;

    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── WebSocket: STOMP push notifications ───────────────────────────────────
    location /ws/push {
        proxy_pass http://127.0.0.1:8183/ws/push;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_connect_timeout 60s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;
    }

    # ── WebSocket: OCPP ───────────────────────────────────────────────────────
    location /ws/ocpp {
        proxy_pass http://127.0.0.1:8183/ws/ocpp;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_connect_timeout 60s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;
    }

    # ── REST API ──────────────────────────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:8183;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_connect_timeout 60s;
        proxy_send_timeout    70s;
        proxy_read_timeout    70s;

        proxy_intercept_errors on;
        error_page 502 503 504 = @api_unavailable;
    }

    location @api_unavailable {
        add_header Content-Type text/plain;
        return 503 "API Gateway is currently unavailable. Please try again later.";
    }

    access_log /var/log/nginx/api-gateway-access.log;
    error_log  /var/log/nginx/api-gateway-error.log;
}

